name: meetsphere

services:
  mongo:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - ./mongo-data:/data/db

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_EXPRESS_PASS}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/MeetSphereDB?authSource=admin
    depends_on:
      - mongo

  backend:
    build: ./backend
    restart: always
    ports:
      - 8080:8080
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/MeetSphereDB?authSource=admin
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SERVER_URL: http://localhost:8080
    restart: always
    ports:
      - 5173:80
    env_file:
    - ./frontend/.env
    depends_on:
    - backend
